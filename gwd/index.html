<html lang="zh-CN">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>GOW - Keep</title>
    <link href="./bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-size: 12px;
            text-align: center;
            background-color: #151a1a;
        }

        #header {
            height: 80px;
            background-color: #001818;
        }

        #header-content {
            margin: 0 auto;
            width: 1800px;
        }

        #content-input {
            margin-top: 10px;
            height: 30px;
            width: 120px;
        }

        #guild-select {
            /* width: 1000px; */
            margin: auto;
            text-align: center;
            font-size: 16px;
            cursor: pointer;
        }

        #content-submit {
            height: 30px;
            margin-top: 10px;
            margin-left: 4px;
        }

        #main-content {
            padding-top: 80px;
            padding-bottom: 50px;
            margin: 10px auto;
            width: 1800px!important;
            background-color: #144f4f;
            border-radius: 4px;
        }

        #keep-guildname {
            color: #fefefe;
            font-size: 16px;
            margin-top: -50px;
        }

        #keep-content {
            background-color: #89c7b2;
            width: 1800px;
            margin-left: 0;
            margin-right: 0;
        }

        .spot-col {
            min-height: 200px;
            padding: 0;
            background-color: #144f4f;
        }

        #spot-col-1 .offset {
            width: 1px;
            height: 115px;
        }

        #spot-col-4 .offset {
            width: 1px;
            height: 230px;
        }

        #spot-col-1,
        #spot-col-2,
        #spot-col-3 {
            border-right: 2px solid rgba(255, 255, 255, 0.1);
        }

        .spot {
            background-color: #f0f0ff;
            width: 376px;
            height: 190px;
            margin: 40px auto;
            padding: 0;
            border-radius: 2px;
            transition: all 0.2s linear;
            position: relative;
            cursor: pointer;
        }

        .spot::before, .spot::after {
            content: '';
            position: absolute;
            width: 100%;
            height: 8px;
            background: linear-gradient(to right, #fcff37, #ffa3c5);
            left: 0;
            transform: scaleX(0);
            transition: transform 0.4s ease-out;
        }

        .spot::before {
            top: -8px;
            transform-origin: left;
        }

        .spot::after {
            bottom: -4px;
            transform-origin: right;
            background: linear-gradient(to right, #af05da, #43ffef);
        }
        
        .spot:hover::after,
        .spot:hover::before {
            transform: scaleX(1);
        }

        .spot-restriction {
            background-color: #399b7a;
            color: #fefefe;
            font-weight: bold;
            height: 30px;
            font-size: 14px;
            line-height: 30px;
        }

        .spot-guys {
            font-size: 12px;
            line-height: 22px;
            display: flex;
            padding: 0 2px;
            margin-top: 6px;
        }

        .spot-guy {
            width: 120px;
            height: 150px;
            margin: 2px;
        }

        .spot-guy-name {
            width: 120px;
            height: 24px;
            border-radius: 2px;
            background-color: #89c7b2;
        }

        .spot-guy-misc {
            width: 120px;
            height: 24px;
            font-size: 11px;
            color: #555;
            background-color: #cfd7cf;
        }

        .spot-guy-troop {
            width: 120px;
            height: 24px;
            color: #222;
            background-color: #d7ddd7;
        }
    </style>

</head>

<body>
    <!-- 
    <script src="https://unpkg.com/vue"></script>
    <script src="https://unpkg.com/http-vue-loader"></script> 
-->
    <script src="./jquery-3.6.0.min.js"></script>
    <script src="./bootstrap.bundle.min.js"></script>
    <script src="./notify.js"></script>
    <script src="../wogapi.js"></script>

    <div id="header">
        <div id="header-content">
            <div style="display: flex; float: right; margin-top: 15px;">
                <!-- <input id="content-input" type="text" class="form-control form-control-sm" placeholder="PASTE">
                <button id="content-submit" type="submit" class="btn btn-success btn-sm">go</button> -->
                <div class="tool-line" style="padding: 10px;">
                    <input id="input-usercode" class="form-control form-control-sm" type="text" placeholder="邀请码">
                </div>
                <div class="tool-line" style="padding: 10px;">
                    <input id="input-password" class="form-control form-control-sm" type="password" placeholder="密码">
                </div>
                <div class="tool-line" style="padding: 10px;">
                    <input id="input-eventid" class="form-control form-control-sm" type="number" placeholder="会战ID">
                </div>
                <div class="tool-line" style="padding: 10px;">
                    <button id="button-sync" type="button" class="float-end btn btn-sm btn-warning">同步数据</button>
                </div>
            </div>
            <div id="guild-select" style="padding-top: 5px; float: left; margin-top: 15px;">
                <div class="btn-group" role="group">
                    <input type="radio" class="btn-check btn-success" name="btnradio" id="button-guild-me" autocomplete="off" checked>
                    <label class="btn btn-outline-success" id="label-guild-d5" for="button-guild-me">WE</label>

                    <input type="radio" class="btn-check" name="btnradio" id="button-guild-d1" autocomplete="off">
                    <label class="btn btn-outline-primary" id="label-guild-d1" for="button-guild-d1">D1</label>

                    <input type="radio" class="btn-check" name="btnradio" id="button-guild-d2" autocomplete="off">
                    <label class="btn btn-outline-primary" id="label-guild-d2" for="button-guild-d2">D2</label>

                    <input type="radio" class="btn-check" name="btnradio" id="button-guild-d3" autocomplete="off">
                    <label class="btn btn-outline-primary" id="label-guild-d3" for="button-guild-d3">D3</label>

                    <input type="radio" class="btn-check" name="btnradio" id="button-guild-d4" autocomplete="off">
                    <label class="btn btn-outline-primary" id="label-guild-d4" for="button-guild-d4">D4</label>
                </div>
            </div>
        </div>
    </div>
    <div id="main-content">
        <div class="row">
            <div id="keep-guildname">

            </div>
        </div>
        <div class="row" id="keep-content">
            <div class="col-3 spot-col" id="spot-col-1"> </div>
            <div class="col-3 spot-col" id="spot-col-2"> </div>
            <div class="col-3 spot-col" id="spot-col-3"> </div>
            <div class="col-3 spot-col" id="spot-col-4"> </div>
        </div>
    </div>

    <script src="../Troops_Chinese.json.js"></script>
    <script src="../Weapons_Chinese.json.js"></script>

    <script>
        const troops = {}

        const weapons = {}

        TROOPS.troops.forEach(T => troops[T.id] = T.name)
        WEAPONS.weapons.forEach(W => weapons[W.id] = W.name)

        function get_name(id) {
            if (`${id}` == '0') {
                return '-'
            }
            if (id in troops) {
                return troops[id]
            }
            else if (id in weapons) {
                return weapons[id]
            }
            else {
                return `${id}`
            }
        }
    </script>

    <script>
        function get_hero_name(hero) {
            const names = {
                elementalist: "元素家",
                stormcaller: "风暴召唤者",
                spiritwalker: "灵力行者",
                thief: '神偷',
                hunter: '金乌',
                monk: '和尚',
                tidecaller: '唤浪',
                assassin: '刺客',
                geomancer: '风水',
                necromancer: '死灵',
                orbweaver: '编织者',
                mechanist: '机械技师'
            }
            return hero in names ? names[hero] : hero;
        }

        function get_restriction_name(restriction) {
            restriction = restriction.toLowerCase();
            const restrictions = {
                wargare: `神社・狼族`,
                wildfolk: "林间空地・蛮族",
                fey: "仙女戒指・妖仙",
                rogue: "盗贼行会・盗贼",

                mystic:  "法师塔・秘士",
                elemental: "门户网站・元素",
                elf: "弗莱彻・精灵",
                goblin: "厨房・哥布林",

                stryx: "鹰巢城・鸟族",
                divine: "寺庙・神祇",
                naga: "药剂师・娜迦",
                tauros: "迷宫・牛头",
                undead: "墓穴・不死族",

                red:  "宫殿・红色",
                blue: "宫殿・蓝色",
                green: "宫殿・绿色",
                purple: "宫殿・紫色",
            }
            return restriction in restrictions ? restrictions[restriction] : restriction;
        }
    </script>

    <script>
        var conf = {}
        var day = 0
        var keeps = []

        const WE = `We`;

        function purify_guild(keep) {

            const get_name = () => `GuildData` in keep ? keep.GuildData.Name : WE;

            const generate_key = (r, l) => `Rank${r}Loc${l}`;

            const generate_guy = (guy, defender) => {
                guy.level = defender.Level || 0;
                guy.name = defender.Name || null;
                guy.team = {};
                if (`DefenceTeam` in defender && `Troops` in defender.DefenceTeam) {
                    guy.team.hero = defender.DefenceTeam.Class || null;
                    guy.team.banner = defender.DefenceTeam.Banner || 0;
                    guy.team.troops = defender.DefenceTeam.Troops || [];
                }
            }

            const generate_spot = (location) => {
                const spot = {
                    restriction: location.Restriction,
                    guys: [
                        { name: null },
                        { name: null },
                        { name: null }
                    ]
                };
                for (const defender of location.Defenders) {
                    generate_guy(spot.guys[defender.SlotIndex], defender);
                }
                return spot;
            }

            const guild = {
                name: get_name(),
                color: keep.DefenceData.Palace.Restriction,
                defenders: [
                    [],
                    [generate_spot(keep.DefenceData.Rank1Loc1), generate_spot(keep.DefenceData.Rank1Loc2)],
                    [generate_spot(keep.DefenceData.Rank2Loc1), generate_spot(keep.DefenceData.Rank2Loc2), generate_spot(keep.DefenceData.Rank2Loc3)],
                    [generate_spot(keep.DefenceData.Rank3Loc1), generate_spot(keep.DefenceData.Rank3Loc2), generate_spot(keep.DefenceData.Rank3Loc3)],
                    [generate_spot(keep.DefenceData.Palace)]
                ]
            };
            return guild;
        }

        function generate_guy(guy) {
            const hide_name = (name) => {
                if (!name) {
                    return ' '
                }
                name = name.replace(/[<>]/g, "")
                if (location.search.match(/fullname/i)) {
                    return name;
                }
                else {
                    return !!name && name.length > 2 ? `${name.substr(0, 2)}...` : name;
                }
            }
            const hero = (!!guy.team && !!guy.team.hero) ? `/ ${get_hero_name(guy.team.hero)}` : '';
            const banner = (!!guy.team && !!guy.team.banner) ? `${guy.team.banner},` : ``;
            const troop = (i) => {
                if (!!guy.team && !!guy.team.troops && i < guy.team.troops.length) {
                    return guy.team.troops[i]
                }
                else {
                    return '';
                }
            }
            const team = `${banner}${troop(0)},${troop(1)},${troop(2)},${troop(3)}`;
            return `
                <div class="spot-guy" team="${team}">
                    <div class="spot-guy-name">
                        ${hide_name(guy.name) || '-'}
                    </div>
                    <div class="spot-guy-misc">
                        ${guy.level || ''} ${hero}
                    </div>
                    <div class="spot-guy-troop">
                        ${get_name(troop(0))}
                    </div>
                    <div class="spot-guy-troop">
                        ${get_name(troop(1))}
                    </div>
                    <div class="spot-guy-troop">
                        ${get_name(troop(2))}
                    </div>
                    <div class="spot-guy-troop">
                        ${get_name(troop(3))}
                    </div>
                </div>
            `
        }

        function translate_restriction() {

        }

        function generate_spot(spot) {
            const s =
                `<div class="spot">
                <div class="spot-restriction">
                    ${get_restriction_name(spot.restriction)}
                </div>
                <div class="spot-guys">
                    ${generate_guy(spot.guys[0])}
                    ${generate_guy(spot.guys[1])}
                    ${generate_guy(spot.guys[2])}
                </div>
            </div>`
            return s;
        }

        function render(d) {
            if (d != day) {
                day = d
                save();
            }

            const keep = keeps[d]
            if (!keep) {
                return
            }

            const guild = purify_guild(keep)
            $("#spot-col-1").empty();
            $("#spot-col-1").append(`<div class="offset"> </div>`)
            $("#spot-col-1").append(generate_spot(guild.defenders[1][0]));
            $("#spot-col-1").append(generate_spot(guild.defenders[1][1]));
            //$("#spot-col-1").append(generate_spot(guild.defenders[1][1]));

            $("#spot-col-2").empty();
            $("#spot-col-2").append(generate_spot(guild.defenders[2][0]));
            $("#spot-col-2").append(generate_spot(guild.defenders[2][1]));
            $("#spot-col-2").append(generate_spot(guild.defenders[2][2]));

            $("#spot-col-3").empty();
            $("#spot-col-3").append(generate_spot(guild.defenders[3][0]));
            $("#spot-col-3").append(generate_spot(guild.defenders[3][1]));
            $("#spot-col-3").append(generate_spot(guild.defenders[3][2]));

            $("#spot-col-4").empty();
            $("#spot-col-4").append(`<div class="offset"> </div>`)
            $("#spot-col-4").append(generate_spot(guild.defenders[4][0]));

            $("#keep-guildname").text(guild.name);

            $(`.spot-guy`).dblclick(async (e) => {
                const team = '[' + $(e.currentTarget).attr('team') + ']';
                if (team.length > 6) {
                    await navigator.clipboard.writeText(team);
                    $.notify("复制成功", "success");
                }
            });
        }

        const impression = () => {
            if (keeps.length > 0) {
                $(`#label-guild-d1`).text('[1] ' + purify_guild(keeps[0]).name)
                $(`#label-guild-d2`).text('[2] ' + purify_guild(keeps[1]).name)
                $(`#label-guild-d3`).text('[3] ' + purify_guild(keeps[2]).name)
                $(`#label-guild-d4`).text('[4] ' + purify_guild(keeps[3]).name)
                setTimeout(() => $(`#label-guild-d${day + 1}`).trigger('click'), 1)
            }
        }

        const load = () => {
            if ($wog.loadPlayer()) {
                $("#input-usercode").val($wog.player.usercode)
                $("#input-password").val($wog.player.password)
            }
            conf = $wog.$get(`KEEP_CONFIG`) || {}
            if (conf.eventid) {
                $(`#input-eventid`).val(conf.eventid)
            }
            if ('day' in conf) {
                day = conf.day || 0
            }
            keeps = $wog.$get(`KEEP_DATA`) || []
            impression()
        }

        const save = () => {
            $wog.savePlayer()
            conf.day = day
            conf.eventid = parseInt($(`#input-eventid`).val())
            conf.guildKeepAt = new Date().getTime(),
            $wog.$set(`KEEP_CONFIG`, conf)
            $wog.$set(`KEEP_DATA`, keeps)
        }

        let syncing = false;
        
        const sync = async () => {
            if (syncing) {
                return
            }

            syncing = true
            $(`#button-sync`).text('正在同步')
            try {
                const code = $(`#input-usercode`).val()
                const pass = $(`#input-password`).val()
                const eventid = parseInt($(`#input-eventid`).val()) || 0
                if (!code || !pass || !eventid) {
                    $.notify(`输入邀请码、密码、ID`, "error");
                    return 
                }

                if (!$wog.player.username || $wog.player.usercode != code || $wog.player.password != pass) {
                    const userid = await $wog.GetUserId(code)
                    if (!userid) {
                        $.notify(`查找用户${code}失败`, "error");
                        return 
                    }
                    const profile = await $wog.GetUserProfile(userid)
                    if (!profile || !profile.username) {
                        $.notify(`查找用户${code}失败`, "error");
                        return
                    }
                    $wog.player.usercode = code
                    $wog.player.password = pass
                    $wog.player.username = profile.username
                    save()
                }

                keeps = []
                for (const day of [0, 1, 2, 3]) {
                    const ans = await $wog.GetGuildKeep($wog.player.username, $wog.player.password, eventid, day)
                    if (`OpponentKeepData` in ans) {
                        keeps.push(ans.OpponentKeepData)
                    }
                    if (day == 3) {
                        keeps.push(ans.MyKeepData)
                    }
                }
                save()
                impression()
            }
            finally {
                syncing = false
                $.notify("同步完成", "info");
                $(`#button-sync`).text('同步数据')
            }
        }

        /*
        $(`#content-submit`).click(() => {
            const content = $(`#content-input`).val();
            if (content) {
                const raw = JSON.parse(content);
                we = raw.result.GuildKeepData.MyKeepData;
                vs = raw.result.GuildKeepData.OpponentKeepData;
                localStorage.setItem(`KEEP_WE`, JSON.stringify(we));
                localStorage.setItem(`KEEP_VS`, JSON.stringify(vs));
                render(vs);
            }
        });
        */

        const select_guild = (d) => {
            render(d)
        }

        $(`#label-guild-d1`).click(() => select_guild(0))
        $(`#label-guild-d2`).click(() => select_guild(1))
        $(`#label-guild-d3`).click(() => select_guild(2))
        $(`#label-guild-d4`).click(() => select_guild(3))
        $(`#label-guild-d5`).click(() => select_guild(4))

        $(`#guild-name`).click(() => {
            toggle();
        })

        $.notify("双击复制阵容", "info");
        
        load()

        $(`#button-sync`).click(sync)

    </script>



</body>
